[project]
name = "hackerblog"
version = "0.1.0"
description = "Follow blogs, turn every post into notes and an interactive lesson, and get notified."
readme = "docs/architecture.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
]

[project.scripts]
hackerblog = "hackerblog.cli.main:run"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackerblog"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PTH", "RUF", "N", "C4", "PL"]
ignore = ["S101", "PLR0911", "PLR0913", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"src/hackerblog/cli/**" = ["PLR0917"]
"tests/**" = ["S105", "S106", "S108", "PLR0915"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
