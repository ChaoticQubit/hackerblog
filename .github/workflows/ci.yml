name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: No LiteLLM in the lockfile
        run: make guard
      - name: Lint and format
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Unit tests
        run: make test
